<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ponytail: o `connect-src` com `localhost` serve só ao HMR do Vite em dev
         (o renderer não faz fetch — tudo é IPC); sobra inócuo em produção. A
         alternativa seria injetar esta meta por `transformIndexHtml` só no build. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://si3.ufc.br data:; connect-src 'self' ws://localhost:* http://localhost:*; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGAA-ME</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
