name: Release SIGAA-ME

# PIPE-001: publicar é um ato deliberado, não uma consequência de `git push`.
#
# Antes: `push: tags: v*.*.*` disparava este workflow, e `npm run release`
# terminava em `electron-builder --publish always`. Como `npm run release:patch`
# faz `git push --follow-tags`, existia um caminho sem freio entre "rodei um
# script" e "o app de todo mundo foi substituído por auto-update" — sem que
# nenhum teste tivesse rodado.
#
# Agora só `workflow_dispatch`: Actions → Release SIGAA-ME → Run workflow.
# Continue usando `npm run release:patch` para versionar e empurrar a tag;
# publicar virou o passo separado. O build local (`npm run build`) não mudou.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar no GitHub Releases (desmarcado = só compila e guarda o instalador como artefato)'
        type: boolean
        default: false

jobs:
  build:
    name: Build & Release Windows
    runs-on: windows-latest

    permissions:
      contents: write # Needed to create releases
      id-token: write # REL-001: exigido por actions/attest-build-provenance
      attestations: write # REL-001: exigido por actions/attest-build-provenance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # PIPE-004: o gate roda aqui dentro, antes do build.
      #
      # Não é `needs:` do job do `quality.yml` — o GitHub não permite depender de
      # um job de outro workflow. Repetir os mesmos comandos é a forma barata; a
      # alternativa (workflow reutilizável com `workflow_call`) é mais máquina do
      # que este projeto precisa hoje.
      #
      # Se qualquer um falhar, o job para e nada é publicado.
      - name: Gate — typecheck
        run: npm run typecheck

      - name: Gate — lint
        run: npm run lint

      - name: Gate — testes e cobertura
        run: npm run coverage

      - name: Gate — auditoria de produção
        run: npm run audit:prod

      # `--publish always` vive aqui, e só aqui. Fora do `package.json`,
      # `npm run release` na sua máquina compila e **não** publica: a flag que
      # substitui o app dos usuários passou a existir num arquivo que exige um
      # clique consciente para executar.
      - name: Build
        run: npm run release

      # Isto empacota uma segunda vez (a saída do `vite build` já está aqui), o
      # que custa ~1-2 min. Aceito de propósito: a alternativa é repetir os
      # passos do script `release` dentro deste YAML, e aí passam a existir duas
      # descrições do build que podem divergir — exatamente o defeito que o
      # `ARCH-003` acabou de eliminar em outro lugar.
      - name: Publish
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
        run: npx electron-builder --win --publish always

      # REL-001: hash e atestado saem daqui, depois do Publish, sem `if`. O
      # `electron-builder` empacota de novo no passo acima e sobrescreve os
      # `.exe` de `release/` — só o que sai depois dele é o que o usuário
      # baixa, tanto com publish=false (arquivos do Build) quanto com
      # publish=true (arquivos que subiram).
      # O `sha256sum` do Git Bash assume modo binário e escreve `<hash> *<arquivo>`.
      # O `sed` troca esse ` *` pelos dois espaços do formato de texto, que é o
      # que o `sha256sum -c` e a comparação manual com `Get-FileHash` esperam.
      # Normalizar a separação em vez de usar `--text` porque o modo texto
      # traduz quebra de linha, e num `.exe` isso mudaria o hash em silêncio.
      # Os `.exe` ficam em `release/<versão>/` (`directories.output` do
      # `electron-builder.json5`), não em `release/` — daí o `$(node -p ...)` e o
      # `release/*/` abaixo.
      - name: Gerar checksums dos instaladores
        shell: bash
        run: cd "release/$(node -p "require('./package.json').version")" && sha256sum *.exe | sed 's/ \*/  /' > SHA256SUMS.txt

      - name: Provar proveniência dos instaladores
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*/*.exe

      - name: Publicar SHA256SUMS.txt na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ inputs.publish }}
        run: gh release upload "v$(node -p "require('./package.json').version")" "release/$(node -p "require('./package.json').version")/SHA256SUMS.txt" --clobber

      - name: Guardar o instalador como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*/*.exe
            release/*/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: warn
