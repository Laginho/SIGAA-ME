name: Quality

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Sem isto o GITHUB_TOKEN de cada job vem com o padrão do repositório. Só o
# job `secrets` recebe mais, para comentar em PR quando o gitleaks acha algo.
permissions:
  contents: read

jobs:
  gate:
    name: Typecheck, lint e testes
    # Windows é a autoridade deste projeto: `npm ci` baixa binário nativo
    # por plataforma (Electron, Playwright) e o autor desenvolve no Windows.
    # Rodar o gate em Linux mudaria o que está sendo verificado.
    runs-on: windows-latest
    # O gate leva ~1m26s; 15 min dá folga sem aceitar o default de 360 min.
    # O run #1 já pendurou, e windows-latest custa 2x em repositório privado.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `npm run coverage` é `vitest run --coverage`: mesma suíte do `npm test`,
      # com os thresholds do `vitest.config.ts` por cima. Rodar os dois seria
      # executar a suíte duas vezes pelo mesmo resultado.
      - name: Unit e integration (com thresholds de cobertura)
        run: npm run coverage

      # Só dependência de produção, só severidade `high` para cima. Dev-dep
      # vulnerável não vai dentro do instalador.
      - name: Auditoria de dependência de produção
        run: npm run audit:prod

  e2e:
    name: E2E sem credencial
    runs-on: windows-latest
    # O E2E leva ~1m45s; 15 min dá folga sem aceitar o default de 360 min.
    # O run #1 já pendurou, e windows-latest custa 2x em repositório privado.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # Sem SIGAA_USER/SIGAA_PASS no ambiente, os 3 testes que fazem login real
      # entram em skip pelo `describeOrSkip` do app.spec.ts. É intencional:
      # credencial de portal universitário não vai para secret de CI, e o CI não
      # deve ficar logando na conta de ninguém a cada push.
      - name: E2E
        run: npm run test:e2e

      - name: Guardar relatório e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            _agent_tmp/shots/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Scanner de segredo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: write é para o comentário que a action posta no PR quando
    # acha um segredo; sem isto o GITHUB_TOKEN herdado (só leitura) faz a chamada
    # da API falhar silenciosamente.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O histórico completo permite à action calcular o intervalo do push;
          # a varredura cobre o que foi empurrado, não é retroativa. Ver PIPE-006.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
